syntax = "proto3";

option csharp_namespace = "AuctionService";

/// The GrpcAuction service provides auction-related operations.
/// Use this service to retrieve auction details by ID.
service GrpcAuction {
    /// Retrieves auction details for a given auction ID.
    /// Provide a valid auction ID in the request to receive auction information.
    rpc GetAuction (GetAuctionRequest) returns (GrpcAuctionResponse);
}

message GetAuctionRequest {
    string id = 1;
}

message GrpcAuctionModel {
    string id = 1;
    string seller = 2;
    string auctionEnd = 3;
    int32 reservePrice = 4;
}

message GrpcAuctionResponse {
    GrpcAuctionModel auction = 1;
}